[build]
  command = "npm run build:css && mkdir -p public/assets && cp -R assets/fonts assets/img public/assets/"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true